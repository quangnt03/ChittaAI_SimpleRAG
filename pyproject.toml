[project]
name = "rag-chitta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "quangnt03", email = "55090045+quangnt03@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.15",
    "langchain-openai>=1.5.2",
    "langchain-text-splitters>=1.1.2",
    "pymilvus>=3.0.0",
    "pydantic-settings>=2.13.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["configs", "generation", "index", "pipelines", "retrieval", "utils", "vectorstore"]
